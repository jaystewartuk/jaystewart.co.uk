allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.2'
  - '@astrojs/markdown-remark@7.2.2'
  - '@astrojs/markdown-satteri@0.3.5'
  - '@astrojs/mdx@7.0.5'
# Transitive dependencies with published security fixes that their parents
# have not picked up yet. Each selector only matches the vulnerable range,
# so an override goes inert once the parent moves past it.
overrides:
  'fast-uri@<3.1.6': ^3.1.6
  'js-yaml@>=3.0.0 <3.15.2': ^3.15.2
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'nanoid@<3.3.18': ^3.3.18
  'svgo@>=4.0.0 <4.1.0': ^4.1.0
  'tmp@<0.2.6': ^0.2.6
  'uuid@<11.1.1': ^11.1.1
